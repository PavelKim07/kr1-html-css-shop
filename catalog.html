<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Каталог – Учебный магазин</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-header__logo" href="index.html">ShopProject</a>
            <nav class="site-nav" aria-label="Основная навигация">
                <ul class="site-nav__list">
                    <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
                    <li class="site-nav__item"><a class="site-nav__link site-nav__link--active"
                            href="catalog.html">Каталог</a></li>
                    <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <nav class="breadcrumbs" aria-label="Хлебные крошки">
            <a class="breadcrumbs__link" href="index.html">Главная</a>
            <span class="breadcrumbs__current">Каталог</span>
        </nav>

        <section class="catalog-layout">
            <aside class="catalog-filters">
                <h2>Фильтры</h2>
                <form class="filters-form" action="#" method="get">
                    <fieldset>
                        <legend>Категория</legend>
                        <label><input type="checkbox" name="category" value="all"> Все товары</label>
                    </fieldset>
                    <button class="button button--primary" type="submit">Применить</button>
                </form>
            </aside>

            <section class="catalog-products">
                <h2>Список товаров</h2>
                <div class="products-grid">
                    <article class="product-card">
                        <h3 class="product-card__title">Товар 1</h3>
                        <p class="product-card__description">Описание.</p>
                        <p class="product-card__price">1000 руб.</p>
                        <a class="button button--secondary product-card__button" href="index.html#popular">Подробнее</a>
                    </article>
                    <article class="product-card">
                        <h3 class="product-card__title">Товар 2</h3>
                        <p class="product-card__description">Описание.</p>
                        <p class="product-card__price">1500 руб.</p>
                        <a class="button button--secondary product-card__button" href="index.html#popular">Подробнее</a>
                    </article>
                </div>
            </section>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Учебный проект.</p>
    </footer>
</body>

</html>
